<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysrVV4Nog6ppJvZ5RqPrIHag-LIAMwOdteaTa9i9Ny9wse63IOqAYtFsTfN4euJ4Gl1A/exec";

    // 1. TỌA ĐỘ MẶC ĐỊNH CỬA HÀNG VÀ BÁN KÍNH CHO PHÉP (ĐƠN VỊ: MÉT)
    const STORE_LAT = 19.780000;
    const STORE_LNG = 105.770000;
    const MAX_ALLOWED_DISTANCE_METERS = 50; // Cho phép chấm công trong bán kính 50m

    const logsContainer = document.getElementById('logs');
    const empIdInput = document.getElementById('empId');
    const empNameInput = document.getElementById('empName');
    const btnIn = document.getElementById('btnIn');
    const btnOut = document.getElementById('btnOut');
    const statusBanner = document.getElementById('statusBanner');
    const locationStatus = document.getElementById('locationStatus');

    let currentLocation = null;
    let isWithinRange = false;

    // Hàm tính khoảng cách giữa 2 tọa độ GPS (Công thức Haversine)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Bán kính Trái Đất tính bằng mét
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c; // Khoảng cách tính bằng mét
    }

    function requestLocation() {
        if (!navigator.geolocation) {
            updateLocationStatus("❌ Trình duyệt không hỗ trợ định vị GPS!", "error");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                
                const latStr = userLat.toFixed(6);
                const lngStr = userLng.toFixed(6);
                currentLocation = `${latStr}, ${lngStr} (https://maps.google.com/?q=${latStr},${lngStr})`;

                // Tính khoảng cách tới cửa hàng
                const distance = calculateDistance(userLat, userLng, STORE_LAT, STORE_LNG);

                if (distance <= MAX_ALLOWED_DISTANCE_METERS) {
                    isWithinRange = true;
                    updateLocationStatus(`📍 Vị trí hợp lệ (${Math.round(distance)}m từ cửa hàng)`, "success");
                    checkCurrentState();
                } else {
                    isWithinRange = false;
                    updateLocationStatus(`❌ Bạn đang ở quá xa cửa hàng (${Math.round(distance)}m). Không thể chấm công!`, "error");
                    btnIn.disabled = true;
                    btnOut.disabled = true;
                }
            },
            (error) => {
                let errorMsg = "❌ Yêu cầu bật quyền GPS để chấm công!";
                if (error.code === error.PERMISSION_DENIED) {
                    errorMsg = "❌ Bạn đã từ chối quyền vị trí. Vui lòng bật GPS!";
                }
                updateLocationStatus(errorMsg, "error");
                btnIn.disabled = true;
                btnOut.disabled = true;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function updateLocationStatus(msg, type) {
        locationStatus.innerText = msg;
        locationStatus.className = `location-info loc-${type}`;
    }

    function checkCurrentState() {
        if (!currentLocation || !isWithinRange) return;

        const activeShift = JSON.parse(localStorage.getItem('activeShift'));
        if (activeShift) {
            lockUI(activeShift.empId, activeShift.empName);
        } else {
            unlockUI();
        }
    }

    async function handleCheckIn() {
        if (!currentLocation || !isWithinRange) { 
            alert("Bạn đang ở ngoài phạm vi cho phép của cửa hàng!"); 
            return; 
        }

        const empId = empIdInput.value.trim();
        const name = empNameInput.value.trim();

        if (!empId) { alert("Vui lòng nhập Mã Nhân Viên!"); empIdInput.focus(); return; }
        if (!name) { alert("Vui lòng nhập Họ và Tên!"); empNameInput.focus(); return; }

        localStorage.setItem('activeShift', JSON.stringify({ empId, empName: name }));
        lockUI(empId, name);

        await sendAttendance('Vào ca', empId, name);
    }

    async function handleCheckOut() {
        if (!currentLocation || !isWithinRange) { 
            alert("Bạn đang ở ngoài phạm vi cho phép của cửa hàng!"); 
            return; 
        }

        const activeShift = JSON.parse(localStorage.getItem('activeShift'));
        if (!activeShift) return;

        await sendAttendance('Hết ca', activeShift.empId, activeShift.empName);

        localStorage.removeItem('activeShift');
        unlockUI();
    }

    function lockUI(empId, name) {
        empIdInput.value = empId;
        empNameInput.value = name;
        empIdInput.disabled = true;
        empNameInput.disabled = true;
        btnIn.disabled = true;
        btnOut.disabled = !isWithinRange;
        statusBanner.style.display = 'block';
    }

    function unlockUI() {
        empIdInput.value = '';
        empNameInput.value = '';
        empIdInput.disabled = false;
        empNameInput.disabled = false;
        btnIn.disabled = !isWithinRange;
        btnOut.disabled = true;
        statusBanner.style.display = 'none';
    }

    async function sendAttendance(type, empId, name) {
        const now = new Date();
        const dateStr = `${now.getDate()}/${now.getMonth() + 1}`;
        const timeStr = now.toTimeString().split(' ')[0];

        const payload = {
            empId: empId,
            empName: name,
            dateStr: dateStr,
            timeStr: timeStr,
            location: currentLocation,
            type: type
        };

        addLogToUI(empId, name, `${timeStr} (${dateStr})`, type);

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (error) {
            console.error("Lỗi gửi dữ liệu:", error);
        }
    }

    function addLogToUI(empId, name, timestamp, type) {
        const logItem = document.createElement('div');
        logItem.className = 'log-item';
        const badgeClass = type === 'Vào ca' ? 'bg-in' : 'bg-out';
        logItem.innerHTML = `
            <div class="log-info">
                <div class="log-name">${name} <span class="log-id">(${empId})</span></div>
                <div class="log-time">${timestamp}</div>
            </div>
            <span class="badge ${badgeClass}">${type}</span>
        `;
        logsContainer.prepend(logItem);
    }

    requestLocation();
</script>
