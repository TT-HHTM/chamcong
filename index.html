<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNG THÙY PHẠM - Hệ Thống Chấm Công</title>
    <!-- Font chữ Serif & Sans-serif cao cấp từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-black: #121212;
            --accent-gold: #c5a059;
            --light-gold: #e6ca65;
            --bg-gray: #f8f7f5;
            --card-bg: #ffffff;
            --border-color: #e2dfd8;
            --text-dark: #222222;
            --text-muted: #777777;
            --success-color: #2e7d32;
            --danger-color: #c62828;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background-color: var(--bg-gray); 
            font-family: 'Montserrat', sans-serif; 
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Luxury Header Section */
        .brand-header {
            text-align: center;
            margin-bottom: 35px;
            width: 100%;
            max-width: 950px;
        }

        .brand-subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary-black);
            text-transform: uppercase;
            line-height: 1.1;
        }

        .brand-divider {
            width: 60px;
            height: 1px;
            background-color: var(--accent-gold);
            margin: 12px auto;
        }

        .brand-contact {
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.6;
        }

        .brand-contact span {
            color: var(--primary-black);
            font-weight: 600;
        }

        /* Authentication Container */
        .auth-container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            color: var(--primary-black);
            border-bottom: 2px solid var(--accent-gold);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        /* User Header Bar */
        .user-bar {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }

        .user-info {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-black);
        }

        .user-info span {
            color: var(--accent-gold);
        }

        .badge-admin {
            background-color: var(--accent-gold);
            color: #fff;
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 10px;
            margin-left: 8px;
            letter-spacing: 1px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 15px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: var(--danger-color);
            color: #fff;
            border-color: var(--danger-color);
        }

        /* Layout Container */
        .container { 
            max-width: 950px; 
            width: 100%; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 30px; 
        }

        @media (max-width: 768px) { 
            .container { grid-template-columns: 1fr; } 
            .brand-title { font-size: 30px; }
        }

        /* Card Styling */
        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 4px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h2 { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px; 
            color: var(--primary-black); 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 10px; 
            text-align: center;
        }

        /* Status Banners */
        .status-banner {
            display: none;
            background-color: #fef8ec;
            color: #8a6d3b;
            border: 1px solid #f5e7c6;
            padding: 10px;
            border-radius: 2px;
            margin-bottom: 20px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 1px;
        }

        .location-info {
            font-size: 11px;
            padding: 10px;
            border-radius: 2px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .loc-loading { background-color: #f2f2f2; color: #666; }
        .loc-success { background-color: #eaf5ea; color: var(--success-color); border: 1px solid #c8e6c9; }
        .loc-error { background-color: #fdeaea; color: var(--danger-color); border: 1px solid #ffcdd2; }

        /* Input Form */
        .form-group { margin-top: 10px; }
        .field { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: var(--primary-black); 
            font-size: 11px; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input, select { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid var(--border-color); 
            border-radius: 2px; 
            font-size: 13px; 
            font-family: 'Montserrat', sans-serif;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-gold);
            background-color: #fff;
        }

        input:disabled, select:disabled { 
            background-color: #f0f0f0; 
            cursor: not-allowed; 
            color: #777; 
            font-weight: 600; 
        }

        /* Buttons */
        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        
        .btn { 
            flex: 1; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 2px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease; 
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--primary-black);
            border: 1px solid var(--primary-black);
        }

        .btn-primary:hover {
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .btn-in { 
            background-color: var(--primary-black); 
            border: 1px solid var(--primary-black);
        }

        .btn-in:hover:not(:disabled) { 
            background-color: var(--accent-gold); 
            border-color: var(--accent-gold);
        }

        .btn-out { 
            background-color: transparent; 
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .btn-out:hover:not(:disabled) { 
            background-color: var(--danger-color); 
            color: white;
        }

        .btn:disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
            border-color: #ccc;
            background-color: #eee;
            color: #888;
        }

        /* Tables & User Management */
        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }

        .user-table th, .user-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
        }

        .user-table th {
            background-color: #fafafa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 10px;
        }

        /* History Logs */
        .log-list { max-height: 380px; overflow-y: auto; }
        
        .log-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 15px 0; 
            border-bottom: 1px solid #f0f0f0; 
        }

        .log-info { flex: 1; }
        
        .log-name { 
            font-weight: 600; 
            color: var(--primary-black); 
            font-size: 13px; 
        }

        .log-id { 
            font-size: 11px; 
            color: var(--accent-gold); 
            font-weight: 600; 
            margin-left: 5px;
        }

        .log-time { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin-top: 4px; 
        }

        .badge { 
            padding: 4px 10px; 
            border-radius: 2px; 
            font-size: 10px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600; 
        }

        .bg-in { background-color: #eaf5ea; color: var(--success-color); }
        .bg-out { background-color: #fdeaea; color: var(--danger-color); }
    </style>
</head>
<body>

<div class="brand-header">
    <div class="brand-subtitle">HAUTE COUTURE & FASHION</div>
    <h1 class="brand-title">DUNG THÙY PHẠM</h1>
    <div class="brand-divider"></div>
    <div class="brand-contact">
        📍 <span>168 Hải Thượng Lãn Ông, Hạc Thành, Thanh Hóa</span><br>
        📞 HOTLINE: <span>0962811996</span>
    </div>
</div>

<!-- KHỐI ĐĂNG NHẬP / ĐĂNG KÝ -->
<div id="authSection" class="auth-container">
    <div class="card">
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Đăng Nhập</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Đăng Ký</button>
        </div>

        <!-- Form Đăng Nhập -->
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="field">
                <label for="loginEmpId">Mã Nhân Viên (Hoặc admin)</label>
                <input type="text" id="loginEmpId" required placeholder="VD: NV01 hoặc admin">
            </div>
            <div class="field">
                <label for="loginPassword">Mật khẩu</label>
                <input type="password" id="loginPassword" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="btn btn-primary">Đăng Nhập</button>
        </form>

        <!-- Form Đăng Ký -->
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
            <div class="field">
                <label for="regEmpId">Mã Nhân Viên</label>
                <input type="text" id="regEmpId" required placeholder="VD: NV01">
            </div>
            <div class="field">
                <label for="regEmpName">Họ và Tên</label>
                <input type="text" id="regEmpName" required placeholder="VD: Nguyễn Văn A">
            </div>
            <div class="field">
                <label for="regPassword">Mật khẩu</label>
                <input type="password" id="regPassword" required placeholder="Tạo mật khẩu">
            </div>
            <button type="submit" class="btn btn-primary">Tạo Tài Khoản</button>
        </form>
    </div>
</div>

<!-- KHỐI HỆ THỐNG (HIỂN THỊ KHI ĐÃ ĐĂNG NHẬP) -->
<div id="attendanceSection" style="display: none; width: 100%; max-width: 950px;">
    <div class="user-bar">
        <div class="user-info">
            Xin chào: <span id="currentUserName">---</span> (<span id="currentUserCode">---</span>)
            <span id="adminBadge" class="badge-admin" style="display: none;">ADMIN</span>
        </div>
        <button class="btn-logout" onclick="handleLogout()">Đăng Xuất</button>
    </div>

    <!-- KHỐI QUẢN TRỊ ADMIN (CHỈ ADMIN MỚI THẤY) -->
    <div id="adminPanel" style="display: none;">
        <div class="card">
            <h2>Quản Lý Nhân Viên & Ca Làm Việc (Admin)</h2>
            <div class="container" style="gap: 20px;">
                <!-- Can Thiệp Ca Làm Việc -->
                <div>
                    <label>Chọn Nhân Viên Để Can Thiệp Ca</label>
                    <select id="adminSelectEmp">
                        <option value="">-- Chọn Nhân Viên --</option>
                    </select>
                    
                    <div class="btn-group" style="margin-top: 15px;">
                        <button class="btn btn-in btn-sm" onclick="adminForceCheckIn()">Ép Vào Ca</button>
                        <button class="btn btn-out btn-sm" onclick="adminForceCheckOut()">Ép Hết Ca</button>
                    </div>
                </div>

                <!-- Đổi Mật Khẩu Nhân Viên -->
                <div>
                    <label>Đổi Mật Khẩu Cho Nhân Viên</label>
                    <input type="password" id="adminNewPass" placeholder="Nhập mật khẩu mới" style="margin-bottom: 10px;">
                    <button class="btn btn-primary btn-sm" onclick="adminChangePassword()">Cập Nhật Mật Khẩu</button>
                </div>
            </div>

            <!-- Danh Sách Tài Khoản Nhân Viên -->
            <div style="margin-top: 25px;">
                <label>Danh Sách Tài Khoản Nhân Viên</label>
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Mã NV</th>
                            <th>Họ và Tên</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- KHỐI CHẤM CÔNG DÀNH CHO NHÂN VIÊN HOẶC ADMIN -->
    <div class="container">
        <div class="card">
            <h2>Chấm Công Trực Tuyến</h2>

            <div id="statusBanner" class="status-banner">
                🔒 ĐANG TRONG CA LÀM VIỆC
            </div>

            <div id="locationStatus" class="location-info loc-loading">
                🔄 Đang xác thực vị trí GPS...
            </div>
            
            <div class="form-group">
                <div class="field">
                    <label for="empId">Mã Nhân Viên</label>
                    <input type="text" id="empId" disabled readonly>
                </div>

                <div class="field">
                    <label for="empName">Họ và Tên</label>
                    <input type="text" id="empName" disabled readonly>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-in" id="btnIn" onclick="handleCheckIn()" disabled>Vào Ca</button>
                    <button class="btn btn-out" id="btnOut" onclick="handleCheckOut()" disabled>Hết Ca</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Lịch Sử Chấm Công</h2>
            <div class="log-list" id="logs"></div>
        </div>
    </div>
</div>

<script>
    // URL Google Apps Script Mới
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYQ48B3Un2zxno6hhMWj0x8kx7bZZ8jWLekPGe7e7PePK4If5cdFf8yGNXt_WSneSX9A/exec";

    // Tọa độ mặc định và giới hạn bán kính (mét)
    const TARGET_LAT = 19.778790;
    const TARGET_LNG = 105.772388;
    const MAX_DISTANCE_METERS = 300;

    const authSection = document.getElementById('authSection');
    const attendanceSection = document.getElementById('attendanceSection');
    const adminPanel = document.getElementById('adminPanel');
    const adminBadge = document.getElementById('adminBadge');
    
    const currentUserName = document.getElementById('currentUserName');
    const currentUserCode = document.getElementById('currentUserCode');

    const logsContainer = document.getElementById('logs');
    const empIdInput = document.getElementById('empId');
    const empNameInput = document.getElementById('empName');
    const btnIn = document.getElementById('btnIn');
    const btnOut = document.getElementById('btnOut');
    const statusBanner = document.getElementById('statusBanner');
    const locationStatus = document.getElementById('locationStatus');

    let currentLocation = "Admin Bypass GPS";
    let isWithinAllowedArea = false;
    let currentUser = null;

    // --- Chuyển Tab Đăng Nhập / Đăng Ký ---
    function switchAuthTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

        if (tab === 'login') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            document.getElementById('registerForm').classList.add('active');
        }
    }

    // --- Đăng Ký Tài Khoản (Đã kết nối Google Sheet) ---
    async function handleRegister(e) {
        e.preventDefault();
        const empId = document.getElementById('regEmpId').value.trim().toUpperCase();
        const empName = document.getElementById('regEmpName').value.trim();
        const password = document.getElementById('regPassword').value;

        if (empId === 'ADMIN') {
            alert("Mã nhân viên 'ADMIN' dành riêng cho quản trị viên!");
            return;
        }

        let users = JSON.parse(localStorage.getItem('users') || '[]');
        
        if (users.some(u => u.empId === empId)) {
            alert("Mã Nhân Viên này đã được đăng ký trên thiết bị này!");
            return;
        }

        // 1. Lưu tại máy cục bộ (localStorage)
        const newUser = { empId, empName, password };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));

        // 2. Gửi tài khoản lên tab 'TaiKhoan' trên Google Sheet
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'register',
                    empId: empId,
                    empName: empName,
                    password: password
                })
            });
            alert("Đăng ký thành công và đã lưu vào Trang tính!");
        } catch (err) {
            console.error("Lỗi gửi dữ liệu đăng ký:", err);
            alert("Đăng ký hoàn tất cục bộ!");
        }

        document.getElementById('registerForm').reset();
        switchAuthTab('login');
    }

    // --- Đăng Nhập ---
    function handleLogin(e) {
        e.preventDefault();
        const inputId = document.getElementById('loginEmpId').value.trim();
        const password = document.getElementById('loginPassword').value;

        // TÀI KHOẢN ADMIN CAO NHẤT
        if (inputId.toLowerCase() === 'admin' && password === 'admin') {
            currentUser = { empId: 'ADMIN', empName: 'Quản Trị Viên', isAdmin: true };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            document.getElementById('loginForm').reset();
            initSession();
            return;
        }

        let users = JSON.parse(localStorage.getItem('users') || '[]');
        const found = users.find(u => u.empId.toUpperCase() === inputId.toUpperCase() && u.password === password);

        if (found) {
            currentUser = { ...found, isAdmin: false };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            document.getElementById('loginForm').reset();
            initSession();
        } else {
            alert("Mã Nhân Viên hoặc Mật khẩu không chính xác!");
        }
    }

    // --- Đăng Xuất ---
    function handleLogout() {
        localStorage.removeItem('currentUser');
        currentUser = null;
        authSection.style.display = 'block';
        attendanceSection.style.display = 'none';
        adminPanel.style.display = 'none';
        adminBadge.style.display = 'none';
    }

    // --- Khởi tạo Phiên làm việc ---
    function initSession() {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            authSection.style.display = 'none';
            attendanceSection.style.display = 'block';

            currentUserName.innerText = currentUser.empName;
            currentUserCode.innerText = currentUser.empId;

            empIdInput.value = currentUser.empId;
            empNameInput.value = currentUser.empName;

            if (currentUser.isAdmin) {
                adminPanel.style.display = 'block';
                adminBadge.style.display = 'inline-block';
                isWithinAllowedArea = true;
                updateLocationStatus("⚡ Quyền Admin: Miễn trừ kiểm tra GPS", "success");
                loadAdminData();
                checkCurrentState();
            } else {
                adminPanel.style.display = 'none';
                adminBadge.style.display = 'none';
                requestLocation();
            }
        } else {
            authSection.style.display = 'block';
            attendanceSection.style.display = 'none';
        }
    }

    // --- TÍNH NĂNG DÀNH CHO ADMIN ---
    function loadAdminData() {
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        const selectEmp = document.getElementById('adminSelectEmp');
        const userTableBody = document.getElementById('userTableBody');

        selectEmp.innerHTML = '<option value="">-- Chọn Nhân Viên --</option>';
        userTableBody.innerHTML = '';

        users.forEach(u => {
            // Thêm vào ô select
            const opt = document.createElement('option');
            opt.value = u.empId;
            opt.innerText = `${u.empName} (${u.empId})`;
            selectEmp.appendChild(opt);

            // Thêm vào bảng danh sách
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${u.empId}</td>
                <td>${u.empName}</td>
                <td>
                    <button class="btn btn-out btn-sm" onclick="adminDeleteUser('${u.empId}')">Xóa</button>
                </td>
            `;
            userTableBody.appendChild(tr);
        });
    }

    function adminChangePassword() {
        const empId = document.getElementById('adminSelectEmp').value;
        const newPass = document.getElementById('adminNewPass').value.trim();

        if (!empId) { alert("Vui lòng chọn nhân viên!"); return; }
        if (!newPass) { alert("Vui lòng nhập mật khẩu mới!"); return; }

        let users = JSON.parse(localStorage.getItem('users') || '[]');
        const index = users.findIndex(u => u.empId === empId);
        if (index !== -1) {
            users[index].password = newPass;
            localStorage.setItem('users', JSON.stringify(users));
            alert(`Đã đổi mật khẩu cho nhân viên ${empId} thành công!`);
            document.getElementById('adminNewPass').value = '';
        }
    }

    function adminDeleteUser(empId) {
        if (confirm(`Bạn có chắc muốn xóa nhân viên ${empId}?`)) {
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            users = users.filter(u => u.empId !== empId);
            localStorage.setItem('users', JSON.stringify(users));
            loadAdminData();
        }
    }

    async function adminForceCheckIn() {
        const empId = document.getElementById('adminSelectEmp').value;
        if (!empId) { alert("Vui lòng chọn nhân viên!"); return; }

        let users = JSON.parse(localStorage.getItem('users') || '[]');
        const targetUser = users.find(u => u.empId === empId);

        if (targetUser) {
            await sendAttendance('Vào ca (Admin ép)', targetUser.empId, targetUser.empName);
            alert(`Đã ép VÀO CA thành công cho ${targetUser.empName}`);
        }
    }

    async function adminForceCheckOut() {
        const empId = document.getElementById('adminSelectEmp').value;
        if (!empId) { alert("Vui lòng chọn nhân viên!"); return; }

        let users = JSON.parse(localStorage.getItem('users') || '[]');
        const targetUser = users.find(u => u.empId === empId);

        if (targetUser) {
            await sendAttendance('Hết ca (Admin ép)', targetUser.empId, targetUser.empName);
            alert(`Đã ép HẾT CA thành công cho ${targetUser.empName}`);
        }
    }

    // --- TÍNH NĂNG ĐỊNH VỊ GPS VÀ CHẤM CÔNG ---
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function requestLocation() {
        if (!navigator.geolocation) {
            updateLocationStatus("❌ Trình duyệt không hỗ trợ định vị GPS!", "error");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                
                const latStr = userLat.toFixed(6);
                const lngStr = userLng.toFixed(6);
                currentLocation = `${latStr}, ${lngStr} (https://maps.google.com/?q=${latStr},${lngStr})`;
                
                const distance = calculateDistance(userLat, userLng, TARGET_LAT, TARGET_LNG);

                if (distance <= MAX_DISTANCE_METERS) {
                    isWithinAllowedArea = true;
                    updateLocationStatus(`📍 Hợp lệ (Cách cửa hàng ${Math.round(distance)}m)`, "success");
                } else {
                    isWithinAllowedArea = false;
                    updateLocationStatus(`❌ Không hợp lệ (Cách cửa hàng ${Math.round(distance)}m, vượt quá ${MAX_DISTANCE_METERS}m)`, "error");
                }
                
                checkCurrentState();
            },
            (error) => {
                let errorMsg = "❌ Yêu cầu bật quyền GPS để chấm công!";
                if (error.code === error.PERMISSION_DENIED) {
                    errorMsg = "❌ Bạn đã từ chối quyền vị trí. Vui lòng bật GPS!";
                }
                updateLocationStatus(errorMsg, "error");
                btnIn.disabled = true;
                btnOut.disabled = true;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function updateLocationStatus(msg, type) {
        locationStatus.innerText = msg;
        locationStatus.className = `location-info loc-${type}`;
    }

    function checkCurrentState() {
        const activeShift = JSON.parse(localStorage.getItem('activeShift'));
        if (activeShift && activeShift.empId === currentUser.empId) {
            lockUI();
        } else {
            unlockUI();
        }
    }

    async function handleCheckIn() {
        if (!isWithinAllowedArea && !currentUser.isAdmin) {
            alert(`Bạn đang ở ngoài phạm vi cho phép (${MAX_DISTANCE_METERS}m). Không thể vào ca!`);
            return;
        }

        localStorage.setItem('activeShift', JSON.stringify({ empId: currentUser.empId, empName: currentUser.empName }));
        lockUI();

        await sendAttendance('Vào ca', currentUser.empId, currentUser.empName);
    }

    async function handleCheckOut() {
        const activeShift = JSON.parse(localStorage.getItem('activeShift'));
        if (!activeShift && !currentUser.isAdmin) return;

        await sendAttendance('Hết ca', currentUser.empId, currentUser.empName);

        localStorage.removeItem('activeShift');
        unlockUI();
    }

    function lockUI() {
        btnIn.disabled = true;
        btnOut.disabled = false;
        statusBanner.style.display = 'block';
    }

    function unlockUI() {
        btnIn.disabled = !isWithinAllowedArea;
        btnOut.disabled = true;
        statusBanner.style.display = 'none';
    }

    async function sendAttendance(type, empId, name) {
        const now = new Date();
        const dateStr = `${now.getDate()}/${now.getMonth() + 1}`;
        const timeStr = now.toTimeString().split(' ')[0];

        const payload = {
            empId: empId,
            empName: name,
            dateStr: dateStr,
            timeStr: timeStr,
            location: currentLocation,
            type: type
        };

        addLogToUI(empId, name, `${timeStr} (${dateStr})`, type);

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (error) {
            console.error("Lỗi gửi dữ liệu lên Google Sheet:", error);
        }
    }

    function addLogToUI(empId, name, timestamp, type) {
        const logItem = document.createElement('div');
        logItem.className = 'log-item';
        const badgeClass = type.includes('Vào ca') ? 'bg-in' : 'bg-out';
        logItem.innerHTML = `
            <div class="log-info">
                <div class="log-name">${name} <span class="log-id">(${empId})</span></div>
                <div class="log-time">${timestamp}</div>
            </div>
            <span class="badge ${badgeClass}">${type}</span>
        `;
        logsContainer.prepend(logItem);
    }

    // Khởi tạo phiên làm việc khi tải trang
    initSession();
</script>
