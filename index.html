<form id="productForm" onsubmit="submitForm(event)">
    <input type="hidden" id="editIndex" value="-1">
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label">Loại hàng <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="loaiHang" value="Hàng hóa" required>
        </div>

        <div class="col-12">
            <label class="form-label">Nhóm hàng (3 Cấp) <span class="text-danger">*</span></label>
            <select class="form-select" id="nhomHang" required>
                <option value="Khác" selected>Khác</option>
                <option value="Áo">Áo</option>
                <option value="Váy">Váy</option>
                <option value="Chân váy">Chân váy</option>
                <option value="Giày">Giày</option>
                <option value="Phụ kiện">Phụ kiện</option>
                <option value="Quần">Quần</option>
                <option value="Quần bò">Quần bò</option>
                <option value="SET">SET</option>
            </select>
        </div>

        <!-- Trường Hình ảnh được chuyển lên đầu/trên Tên hàng -->
        <div class="col-12">
            <label class="form-label">Hình ảnh (URL hoặc chụp ảnh)</label>
            <div class="input-group">
                <input type="text" class="form-control" id="hinhAnh" placeholder="Chụp ảnh hoặc dán URL">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="d-none" onchange="handleCameraCapture(event)">
                <button type="button" class="btn btn-outline-primary fw-semibold" onclick="document.getElementById('cameraInput').click()">
                    📸 Chụp
                </button>
            </div>
            <div id="imagePreviewContainer" class="d-flex gap-2 mt-2 overflow-x-auto"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Tên hàng <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-lg fw-semibold text-primary" id="tenHang" placeholder="Nhập tên sản phẩm..." required autofocus>
        </div>

        <div class="col-6">
            <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="giaBan" value="0" required>
        </div>
        <div class="col-6">
            <label class="form-label">Giá vốn (VNĐ)</label>
            <input type="number" class="form-control" id="giaVon" value="0" required>
        </div>

        <div class="col-12 mt-4 d-grid gap-2">
            <button type="submit" id="submitBtn" class="btn btn-primary btn-mobile-lg fw-bold shadow-sm">
                ➕ Thêm Vào Danh Sách (Enter)
            </button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary btn-mobile-lg fw-bold d-none" onclick="cancelEdit()">
                ❌ Hủy Sửa
            </button>
        </div>
    </div>
</form>
